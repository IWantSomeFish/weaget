<svg
    width="64"
    height="64"
    viewBox="0 0 64 64"
    xmlns="http://www.w3.org/2000/svg"
>
    <!-- Sun -->
    <g class="weather-sun">
        <circle
            class="weather-sun-core"
            cx="25"
            cy="27"
            r="10"
        />

        <!-- rays -->
        <g
            class="weather-sun-rays"
            fill="none"
            stroke-width="2.5"
            stroke-linecap="round"
        >
            <line x1="25" y1="8"  x2="25" y2="13"/>
            <line x1="25" y1="41" x2="25" y2="46"/>

            <line x1="6"  y1="27" x2="11" y2="27"/>
            <line x1="39" y1="27" x2="44" y2="27"/>

            <line x1="11.5" y1="13.5" x2="15.5" y2="17.5"/>
            <line x1="34.5" y1="36.5" x2="38.5" y2="40.5"/>

            <line x1="38.5" y1="13.5" x2="34.5" y2="17.5"/>
            <line x1="15.5" y1="36.5" x2="11.5" y2="40.5"/>
        </g>
    </g>

    <!-- Cloud -->
    <g class="weather-cloud">

        <!-- Cloud shadow -->
        <path
            class="weather-cloud-shadow"
            d="
                M11 52
                C7 52 5 49 5 45
                C5 41 8 38 12 37
                C13 32 17 29 22 29
                C28 29 32 32.5 33 37
                C34.5 36 36.5 35.5 39 35.5
                C44.5 35.5 49 39.5 49 45
                C49 49 46 52 42 52
                Z
            "
        />

        <!-- Cloud bright -->
        <path
            class="weather-cloud-highlight"
            d="
                M11 47
                C8.5 47 7 45 7 42.5
                C7 39.5 9.5 37.5 13 37.5
                C14 33.5 17.5 31 22 31
                C26.5 31 30 34 30 38
                C30 39.5 29.5 40.5 29 41.5
                C31 39 34 37.5 37.5 37.5
                C41.5 37.5 44.5 40.5 44.5 44.5
                C44.5 45.5 44 46.5 43.5 47
                Z
            "
        />
    </g>
</svg>