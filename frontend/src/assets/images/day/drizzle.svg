<svg
    width="64"
    height="64"
    viewBox="0 0 64 64"
    xmlns="http://www.w3.org/2000/svg"
>
    <!-- Солнце -->
    <g class="weather-sun">
        <circle
            class="weather-sun-core"
            cx="25"
            cy="26"
            r="9"
        />

        <g
            class="weather-sun-rays"
            fill="none"
            stroke-width="2.2"
            stroke-linecap="round"
        >
            <line x1="25" y1="8" x2="25" y2="13"/>
            <line x1="25" y1="39" x2="25" y2="44"/>
            <line x1="7" y1="26" x2="12" y2="26"/>
            <line x1="38" y1="26" x2="43" y2="26"/>

            <line x1="12" y1="13" x2="16" y2="17"/>
            <line x1="34" y1="35" x2="38" y2="39"/>
            <line x1="38" y1="13" x2="34" y2="17"/>
            <line x1="16" y1="35" x2="12" y2="39"/>
        </g>
    </g>

    <!-- Облако -->
    <g class="weather-cloud">
        <path
            class="weather-cloud-shadow"
            d="
                M11 43
                C7 43 5 45.5 5 48.5
                C5 51.5 7.5 53 11 53
                H43
                C47 53 49 50.5 49 47
                C49 43 46 40 42 40
                C40 40 38.5 40.5 37 42
                C36 37 31.5 33 26 33
                C21 33 17 36 16 40
                C14.5 39 12.5 39 11 40
                Z
            "
        />

        <path
            class="weather-cloud-highlight"
            d="
                M11 47
                C8.5 47 7 48.5 7 50
                C7 51 8.5 52 11 52
                H42
                C45 52 47 50 47 47
                C47 44 44.5 42 41.5 42
                C39 42 37 43 36 45
                C35 40 31 36 26 36
                C21.5 36 18 39 17.5 43
                C16 42 14 42 12.5 43
                C11.5 44 11 45 11 47
                Z
            "
        />
    </g>

    <!-- Мелкий дождь -->
    <g
        class="weather-drizzle"
        fill="none"
        stroke-width="2"
        stroke-linecap="round"
    >
        <path d="M13 56 L11 60"/>
        <path d="M22 57 L20 61"/>
        <path d="M31 55 L29 59"/>
        <path d="M40 57 L38 61"/>
    </g>
</svg>