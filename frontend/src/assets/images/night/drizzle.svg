                C5 51.5 7.5 53 11 53
                H43
                C47 53 49 50.5 49 47
                C49 43 46 40 42 40
                C40 40 38.5 40.5 37 42
                C36 37 31.5 33 26 33
                C21 33 17 36 16 40
                C14.5 39 12.5 39 11 40
